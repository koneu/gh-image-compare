name: Golden Image Pipeline

on:
  # No paths filter: Image Gate is a required status check, and a required
  # check from a path-filtered workflow never reports (and so blocks
  # merging forever) on a PR that doesn't touch those paths. Runs on every
  # PR instead; if the generator/golden haven't changed, compare trivially
  # passes.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: 'Variant number passed to generate_test_image.py (change this to simulate a different rendered image), applied to every component'
        required: false
        default: '0'

env:
  MIN_SSIM: '0.98'
  CLOUDSMITH_REPO: koneu/image-test

jobs:
  # Lists the tracked components (golden-images/components.json) so compare
  # can run one matrix leg per component. A static file for now; swap for a
  # step that lists the real component test suite's output directory later.
  plan:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.list.outputs.components }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List components
        id: list
        run: echo "components=$(jq -c . golden-images/components.json)" >> "$GITHUB_OUTPUT"

  compare:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.plan.outputs.components) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Generate candidate image
        run: |
          python3 generate_test_image.py --component "${{ matrix.component }}" \
            --variant "${{ github.event.inputs.variant || '0' }}" --out candidate.png

      - name: Resolve current golden image
        id: golden
        run: |
          MANIFEST="golden-images/${{ matrix.component }}.manifest.json"
          if [ -s "$MANIFEST" ] && [ "$(jq -r '.current // empty' "$MANIFEST")" != "" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "version=$(jq -r '.current.version' "$MANIFEST")" >> "$GITHUB_OUTPUT"
            echo "package=$(jq -r '.package_name' "$MANIFEST")" >> "$GITHUB_OUTPUT"
            echo "filename=$(jq -r '.current.filename' "$MANIFEST")" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download golden image
        if: steps.golden.outputs.exists == 'true'
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          cloudsmith download "$CLOUDSMITH_REPO" "${{ steps.golden.outputs.package }}" \
            --version "${{ steps.golden.outputs.version }}" --outfile golden.png -y

      - name: Compare images
        id: compare
        run: |
          if [ "${{ steps.golden.outputs.exists }}" == "true" ]; then
            python3 scripts/compare_images.py --candidate candidate.png --golden golden.png --min-ssim "$MIN_SSIM"
          else
            python3 scripts/compare_images.py --candidate candidate.png --min-ssim "$MIN_SSIM"
          fi

      # GitHub strips data: URI images from job summaries, so golden/candidate/diff
      # need to be reachable over https to actually render. Candidate and diff only
      # exist for this run, so they're pushed as short-lived preview packages; golden
      # already lives in Cloudsmith. All three URLs embed the read-only entitlement
      # token so the image loads without auth (image-test is a private repo).
      - name: Publish preview images
        id: previews
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          RUN_TAG="run-${{ github.run_id }}-${{ github.run_attempt }}"
          TOKEN="${{ vars.CLOUDSMITH_ENTITLEMENT_TOKEN }}"
          COMPONENT="${{ matrix.component }}"

          cloudsmith push raw "$CLOUDSMITH_REPO" candidate.png --name "${COMPONENT}-preview" --version "$RUN_TAG" >/dev/null
          echo "candidate_url=https://dl.cloudsmith.io/$TOKEN/$CLOUDSMITH_REPO/raw/names/${COMPONENT}-preview/versions/$RUN_TAG/candidate.png" >> "$GITHUB_OUTPUT"

          if [ -f diff.png ]; then
            cloudsmith push raw "$CLOUDSMITH_REPO" diff.png --name "${COMPONENT}-diff-preview" --version "$RUN_TAG" >/dev/null
            echo "diff_url=https://dl.cloudsmith.io/$TOKEN/$CLOUDSMITH_REPO/raw/names/${COMPONENT}-diff-preview/versions/$RUN_TAG/diff.png" >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ steps.golden.outputs.exists }}" == "true" ]; then
            echo "golden_url=https://dl.cloudsmith.io/$TOKEN/$CLOUDSMITH_REPO/raw/names/${{ steps.golden.outputs.package }}/versions/${{ steps.golden.outputs.version }}/${{ steps.golden.outputs.filename }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Render summary
        run: |
          python3 scripts/render_summary.py \
            --component "${{ matrix.component }}" \
            --status "${{ steps.compare.outputs.status }}" \
            --candidate-url "${{ steps.previews.outputs.candidate_url }}" \
            --diff-url "${{ steps.previews.outputs.diff_url }}" \
            --golden-url "${{ steps.previews.outputs.golden_url }}" \
            --golden-size "${{ steps.compare.outputs.golden_size }}" \
            --candidate-size "${{ steps.compare.outputs.candidate_size }}" \
            --ssim-score "${{ steps.compare.outputs.ssim_score }}" \
            --min-ssim "$MIN_SSIM"

      # Matrix job outputs collapse to whichever leg finishes last, so
      # per-component results for collect/promote travel as artifacts
      # instead of `needs.compare.outputs.*`.
      - name: Write compare result
        run: |
          jq -n \
            --arg component "${{ matrix.component }}" \
            --arg exceeds "${{ steps.compare.outputs.exceeds_threshold }}" \
            --arg ssim "${{ steps.compare.outputs.ssim_score }}" \
            '{component: $component, exceeds_threshold: $exceeds, ssim_score: $ssim}' \
            > "result-${{ matrix.component }}.json"

      - name: Upload compare result
        uses: actions/upload-artifact@v4
        with:
          name: compare-result-${{ matrix.component }}
          path: result-${{ matrix.component }}.json

      - name: Upload candidate for promotion
        uses: actions/upload-artifact@v4
        with:
          name: candidate-image-${{ matrix.component }}
          path: candidate.png
          retention-days: 14

      - name: Enforce threshold
        if: steps.golden.outputs.exists == 'true' && steps.compare.outputs.exceeds_threshold == 'true'
        run: |
          echo "SSIM score ${{ steps.compare.outputs.ssim_score }} is below minimum $MIN_SSIM"
          exit 1

  # Reads every component's compare result and decides which ones need a
  # promotion job. Always runs, even if some/all compare legs failed.
  collect:
    needs: compare
    if: always()
    runs-on: ubuntu-latest
    outputs:
      components_needing_promotion: ${{ steps.collect.outputs.components }}
    steps:
      - name: Download all compare results
        uses: actions/download-artifact@v4
        with:
          pattern: compare-result-*
          path: results
          merge-multiple: true

      - name: Determine components needing promotion
        id: collect
        run: |
          python3 - <<'PYEOF'
          import glob
          import json
          import os

          needed = []
          for path in glob.glob("results/result-*.json"):
              with open(path) as f:
                  data = json.load(f)
              if data["exceeds_threshold"] == "true":
                  needed.append(data["component"])

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"components={json.dumps(sorted(needed))}\n")
          print("components needing promotion:", sorted(needed))
          PYEOF

  # One matrix leg per component that needs a new golden, each gated
  # independently behind golden-image-approval. max-parallel: 1 plus a
  # pull --rebase before pushing keeps sibling promotions from racing on
  # the same branch. Runs zero legs (and is skipped) if nothing changed.
  promote:
    needs: collect
    if: always()
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        component: ${{ fromJSON(needs.collect.outputs.components_needing_promotion) }}
    runs-on: ubuntu-latest
    environment: golden-image-approval
    permissions:
      contents: write
    steps:
      # Checks out the PR's own branch (not the ephemeral merge ref) so the
      # manifest bump lands as a commit on the PR itself. Only works for PRs
      # from branches in this repo, not forks (GITHUB_TOKEN can't push to a
      # fork's branch).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install Cloudsmith CLI
        run: pip install cloudsmith-cli

      - name: Download candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: candidate-image-${{ matrix.component }}

      - name: Compute next version
        id: version
        run: |
          MANIFEST="golden-images/${{ matrix.component }}.manifest.json"
          if [ -s "$MANIFEST" ]; then
            CURRENT=$(jq -r '.current.version // "v0"' "$MANIFEST" | sed 's/^v//')
          else
            CURRENT=0
          fi
          NEXT=$((CURRENT + 1))
          echo "version=v$NEXT" >> "$GITHUB_OUTPUT"

      - name: Upload candidate as new golden
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          cp candidate.png output.png
          cloudsmith push raw "$CLOUDSMITH_REPO" output.png \
            --name "${{ matrix.component }}" --version "${{ steps.version.outputs.version }}" \
            --summary "Golden image ${{ matrix.component }} ${{ steps.version.outputs.version }}, promoted by ${{ github.actor }}"

      - name: Update manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          SHA=$(sha256sum output.png | cut -d' ' -f1)
          jq -n \
            --arg owner "koneu" \
            --arg repo "image-test" \
            --arg pkg "${{ matrix.component }}" \
            --arg version "${{ steps.version.outputs.version }}" \
            --arg sha256 "$SHA" \
            --arg promoted_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg promoted_by "${{ github.actor }}" \
            --arg run_id "${{ github.run_id }}" \
            '{cloudsmith_owner: $owner, cloudsmith_repo: $repo, package_name: $pkg, current: {version: $version, filename: "output.png", sha256: $sha256, promoted_at: $promoted_at, promoted_by: $promoted_by, workflow_run_id: $run_id}}' \
            > "golden-images/${{ matrix.component }}.manifest.json"
          git add "golden-images/${{ matrix.component }}.manifest.json"
          git commit -m "Promote ${{ matrix.component }} to ${{ steps.version.outputs.version }}"
          git push

  # The single required status check for branch protection. Succeeds if
  # every component either passed compare outright, or got an approved
  # promotion. While any promotion sits pending approval, this job hasn't
  # run yet (needs: waits for all matrix legs to reach a terminal state),
  # so the check stays pending too.
  gate:
    name: Image Gate
    needs: [compare, promote]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate
        run: |
          if [ "${{ needs.compare.result }}" == "success" ] || [ "${{ needs.promote.result }}" == "success" ]; then
            echo "Every component matched its golden, or had a promotion approved."
            exit 0
          else
            echo "At least one component doesn't match golden and has no approved promotion."
            exit 1
          fi
