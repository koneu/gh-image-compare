name: Golden Image Pipeline

on:
  # No paths filter: Image Gate is a required status check, and a required
  # check from a path-filtered workflow never reports (and so blocks
  # merging forever) on a PR that doesn't touch those paths. Runs on every
  # PR instead; if the generator/golden haven't changed, compare trivially
  # passes.
  pull_request:
    branches: [main]
  # Preview-only: runs compare against the current goldens but never
  # promotes (see promote's `if`), since that would mean pushing straight
  # to whatever branch was selected - main included, which is protected.
  workflow_dispatch:
    inputs:
      variant:
        description: 'Variant number passed to generate_test_image.py (change this to simulate a different rendered image), applied to every component/image'
        required: false
        default: '0'

env:
  MIN_SSIM: '0.98'
  CLOUDSMITH_REPO: koneu/image-test

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # components.json maps component -> list of image names (one component
      # can produce more than one picture, e.g. several states from a single
      # test). Flattened here into one matrix entry per (component, image)
      # pair; "id" is what Cloudsmith package/preview names key off. image
      # "default" collapses id down to just the component name, so existing
      # single-image components/goldens are unaffected.
      - name: List component/image matrix
        id: list
        run: |
          python3 - <<'PYEOF'
          import json
          import os

          components = json.load(open("golden-images/components.json"))
          matrix = []
          for component, images in components.items():
              for image in images:
                  image_id = component if image == "default" else f"{component}-{image}"
                  matrix.append({"id": image_id, "component": component, "image": image})

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps(matrix)}\n")
          print(json.dumps(matrix, indent=2))
          PYEOF

  compare:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Generate candidate image
        run: |
          python3 generate_test_image.py --component "${{ matrix.component }}" --image "${{ matrix.image }}" \
            --variant "${{ github.event.inputs.variant || '0' }}" --out candidate.png

      # One manifest per component (not per image/picture) - golden-images/<component>.manifest.json
      # holds a .images.<image> entry for each of that component's pictures.
      - name: Resolve current golden image
        id: golden
        run: |
          MANIFEST="golden-images/${{ matrix.component }}.manifest.json"
          ENTRY=""
          if [ -s "$MANIFEST" ]; then
            ENTRY=$(jq -c --arg img "${{ matrix.image }}" '.images[$img] // empty' "$MANIFEST")
          fi
          if [ -n "$ENTRY" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "version=$(echo "$ENTRY" | jq -r '.current.version')" >> "$GITHUB_OUTPUT"
            echo "package=$(echo "$ENTRY" | jq -r '.package_name')" >> "$GITHUB_OUTPUT"
            echo "filename=$(echo "$ENTRY" | jq -r '.current.filename')" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download golden image
        if: steps.golden.outputs.exists == 'true'
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          cloudsmith download "$CLOUDSMITH_REPO" "${{ steps.golden.outputs.package }}" \
            --version "${{ steps.golden.outputs.version }}" --outfile golden.png -y

      - name: Compare images
        id: compare
        run: |
          if [ "${{ steps.golden.outputs.exists }}" == "true" ]; then
            python3 scripts/compare_images.py --candidate candidate.png --golden golden.png --min-ssim "$MIN_SSIM"
          else
            python3 scripts/compare_images.py --candidate candidate.png --min-ssim "$MIN_SSIM"
          fi

      # GitHub strips data: URI images from job summaries, so golden/candidate/diff
      # need to be reachable over https to actually render. Candidate and diff only
      # exist for this run, so they're pushed as short-lived preview packages; golden
      # already lives in Cloudsmith. All three URLs embed the read-only entitlement
      # token so the image loads without auth (image-test is a private repo). This
      # candidate push doubles as promote's source image later (see promote's
      # "Download candidate" step) instead of a separate per-image GitHub artifact -
      # with potentially hundreds of pictures per run, hundreds of tiny GitHub
      # artifacts don't scale well, and this candidate is already being uploaded
      # here regardless.
      - name: Publish preview images
        id: previews
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          RUN_TAG="run-${{ github.run_id }}-${{ github.run_attempt }}"
          TOKEN="${{ vars.CLOUDSMITH_ENTITLEMENT_TOKEN }}"
          ID="${{ matrix.id }}"

          cloudsmith push raw "$CLOUDSMITH_REPO" candidate.png --name "${ID}-preview" --version "$RUN_TAG" >/dev/null
          echo "candidate_url=https://dl.cloudsmith.io/$TOKEN/$CLOUDSMITH_REPO/raw/names/${ID}-preview/versions/$RUN_TAG/candidate.png" >> "$GITHUB_OUTPUT"

          if [ -f diff.png ]; then
            cloudsmith push raw "$CLOUDSMITH_REPO" diff.png --name "${ID}-diff-preview" --version "$RUN_TAG" >/dev/null
            echo "diff_url=https://dl.cloudsmith.io/$TOKEN/$CLOUDSMITH_REPO/raw/names/${ID}-diff-preview/versions/$RUN_TAG/diff.png" >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ steps.golden.outputs.exists }}" == "true" ]; then
            echo "golden_url=https://dl.cloudsmith.io/$TOKEN/$CLOUDSMITH_REPO/raw/names/${{ steps.golden.outputs.package }}/versions/${{ steps.golden.outputs.version }}/${{ steps.golden.outputs.filename }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Render summary
        run: |
          python3 scripts/render_summary.py \
            --component "${{ matrix.id }}" \
            --status "${{ steps.compare.outputs.status }}" \
            --candidate-url "${{ steps.previews.outputs.candidate_url }}" \
            --diff-url "${{ steps.previews.outputs.diff_url }}" \
            --golden-url "${{ steps.previews.outputs.golden_url }}" \
            --golden-size "${{ steps.compare.outputs.golden_size }}" \
            --candidate-size "${{ steps.compare.outputs.candidate_size }}" \
            --ssim-score "${{ steps.compare.outputs.ssim_score }}" \
            --min-ssim "$MIN_SSIM"

      # Matrix job outputs collapse to whichever leg finishes last, so
      # per-image results for collect/promote travel as artifacts instead
      # of `needs.compare.outputs.*`. These are tiny structured data (not
      # images) handed between jobs within this one run - exactly what
      # GitHub artifacts are for, so unlike the candidate image this one
      # stays as-is regardless of how many images are in the matrix.
      - name: Write compare result
        run: |
          jq -n \
            --arg id "${{ matrix.id }}" \
            --arg component "${{ matrix.component }}" \
            --arg image "${{ matrix.image }}" \
            --arg exceeds "${{ steps.compare.outputs.exceeds_threshold }}" \
            --arg ssim "${{ steps.compare.outputs.ssim_score }}" \
            '{id: $id, component: $component, image: $image, exceeds_threshold: $exceeds, ssim_score: $ssim}' \
            > "result-${{ matrix.id }}.json"

      - name: Upload compare result
        uses: actions/upload-artifact@v4
        with:
          name: compare-result-${{ matrix.id }}
          path: result-${{ matrix.id }}.json

      - name: Enforce threshold
        if: steps.golden.outputs.exists == 'true' && steps.compare.outputs.exceeds_threshold == 'true'
        run: |
          echo "SSIM score ${{ steps.compare.outputs.ssim_score }} is below minimum $MIN_SSIM"
          exit 1

  # Reads every image's compare result and decides which ones need a
  # promotion job. Always runs, even if some/all compare legs failed.
  collect:
    needs: compare
    if: always()
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
    steps:
      - name: Download all compare results
        uses: actions/download-artifact@v4
        with:
          pattern: compare-result-*
          path: results
          merge-multiple: true

      - name: Determine images needing promotion
        id: collect
        run: |
          python3 - <<'PYEOF'
          import glob
          import json
          import os

          needed = []
          for path in glob.glob("results/result-*.json"):
              with open(path) as f:
                  data = json.load(f)
              if data["exceeds_threshold"] == "true":
                  needed.append({"id": data["id"], "component": data["component"], "image": data["image"]})
          needed.sort(key=lambda e: e["id"])

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps(needed)}\n")
          print("images needing promotion:", [e["id"] for e in needed])
          PYEOF

  # One matrix leg per image that needs a new golden, each gated
  # independently behind golden-image-approval. max-parallel: 1 plus a
  # pull --rebase before pushing keeps sibling promotions from racing on
  # the same branch (including two images of the same component landing
  # in the same manifest file). Runs zero legs (and is skipped) if
  # nothing changed.
  promote:
    needs: collect
    # workflow_dispatch runs are for previewing a compare against the
    # current golden (e.g. "does this variant still match?") - they check
    # out whatever branch was selected, which for a run against main is
    # main itself. Actually promoting would mean pushing straight to main,
    # which branch protection rejects (confirmed: GH006, protected branch
    # update failed) and also isn't a real change to review anyway. Real
    # promotions only happen through a PR.
    if: always() && github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.collect.outputs.matrix) }}
    runs-on: ubuntu-latest
    environment: golden-image-approval
    permissions:
      contents: write
    steps:
      # Checks out the PR's own branch (not the ephemeral merge ref) so the
      # manifest bump lands as a commit on the PR itself. Only works for PRs
      # from branches in this repo, not forks (GITHUB_TOKEN can't push to a
      # fork's branch).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install Cloudsmith CLI
        run: pip install cloudsmith-cli

      # Re-downloads compare's own preview push (same run, same RUN_TAG)
      # instead of a GitHub artifact - see the comment on "Publish preview
      # images" in compare.
      - name: Download candidate
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          RUN_TAG="run-${{ github.run_id }}-${{ github.run_attempt }}"
          cloudsmith download "$CLOUDSMITH_REPO" "${{ matrix.id }}-preview" --version "$RUN_TAG" --outfile candidate.png -y

      - name: Compute next version
        id: version
        run: |
          MANIFEST="golden-images/${{ matrix.component }}.manifest.json"
          CURRENT="v0"
          if [ -s "$MANIFEST" ]; then
            CURRENT=$(jq -r --arg img "${{ matrix.image }}" '.images[$img].current.version // "v0"' "$MANIFEST")
          fi
          NEXT=$(( $(echo "$CURRENT" | sed 's/^v//') + 1 ))
          echo "version=v$NEXT" >> "$GITHUB_OUTPUT"

      - name: Upload candidate as new golden
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          cp candidate.png output.png
          cloudsmith push raw "$CLOUDSMITH_REPO" output.png \
            --name "${{ matrix.id }}" --version "${{ steps.version.outputs.version }}" \
            --summary "Golden image ${{ matrix.id }} ${{ steps.version.outputs.version }}, promoted by ${{ github.actor }}"

      # Read-modify-write: only this image's entry in the component's
      # manifest changes, every sibling image's entry is preserved as-is.
      - name: Update manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          MANIFEST="golden-images/${{ matrix.component }}.manifest.json"
          SHA=$(sha256sum output.png | cut -d' ' -f1)
          if [ -s "$MANIFEST" ]; then
            BASE=$(cat "$MANIFEST")
          else
            BASE='{"cloudsmith_owner":"koneu","cloudsmith_repo":"image-test","component":"${{ matrix.component }}","images":{}}'
          fi
          echo "$BASE" | jq \
            --arg img "${{ matrix.image }}" \
            --arg pkg "${{ matrix.id }}" \
            --arg version "${{ steps.version.outputs.version }}" \
            --arg sha256 "$SHA" \
            --arg promoted_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg promoted_by "${{ github.actor }}" \
            --arg run_id "${{ github.run_id }}" \
            '.images[$img] = {package_name: $pkg, current: {version: $version, filename: "output.png", sha256: $sha256, promoted_at: $promoted_at, promoted_by: $promoted_by, workflow_run_id: $run_id}}' \
            > "$MANIFEST"
          git add "$MANIFEST"
          git commit -m "Promote ${{ matrix.id }} to ${{ steps.version.outputs.version }}"
          git push

  # The single required status check for branch protection. Succeeds if
  # every image either passed compare outright, or got an approved
  # promotion. While any promotion sits pending approval, this job hasn't
  # run yet (needs: waits for all matrix legs to reach a terminal state),
  # so the check stays pending too.
  gate:
    name: Image Gate
    needs: [compare, promote]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      # promote pushes commits (the manifest bump) onto the PR branch after
      # this run's checks already started. GITHUB_TOKEN pushes don't trigger
      # a new pull_request run, so that new HEAD commit would otherwise
      # never get its own "Image Gate" check - leaving branch protection
      # waiting on it forever, even though everything actually passed. Mirror
      # this run's conclusion onto whatever the branch's current HEAD is.
      - name: Evaluate and report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ needs.compare.result }}" == "success" ] || [ "${{ needs.promote.result }}" == "success" ]; then
            CONCLUSION="success"
            echo "Every image matched its golden, or had a promotion approved."
          else
            CONCLUSION="failure"
            echo "At least one image doesn't match golden and has no approved promotion."
          fi

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BRANCH="${{ github.head_ref }}"
            CURRENT_SHA=$(gh api "repos/${{ github.repository }}/git/ref/heads/$BRANCH" --jq .object.sha)
            if [ "$CURRENT_SHA" != "${{ github.sha }}" ]; then
              gh api "repos/${{ github.repository }}/check-runs" -X POST \
                -f name="Image Gate" -f head_sha="$CURRENT_SHA" -f status="completed" -f conclusion="$CONCLUSION" >/dev/null
              echo "Mirrored Image Gate ($CONCLUSION) onto $CURRENT_SHA (branch head moved during this run)"

              # Unit Tests/SCA (ci.yml) hit the exact same problem: they only
              # ran against the original triggering SHA, so without this
              # they'd also be stuck on "Expected" on the real HEAD. Mirror
              # their actual recorded conclusions across too. (If more
              # required checks get added later, add their names here too.)
              for OTHER_CHECK in "Unit Tests" "SCA"; do
                OTHER_CONCLUSION=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" \
                  --jq ".check_runs[] | select(.name == \"$OTHER_CHECK\") | .conclusion" | head -1)
                if [ -n "$OTHER_CONCLUSION" ]; then
                  gh api "repos/${{ github.repository }}/check-runs" -X POST \
                    -f name="$OTHER_CHECK" -f head_sha="$CURRENT_SHA" -f status="completed" -f conclusion="$OTHER_CONCLUSION" >/dev/null
                  echo "Mirrored $OTHER_CHECK ($OTHER_CONCLUSION) onto $CURRENT_SHA"
                fi
              done
            fi
          fi

          [ "$CONCLUSION" == "success" ]
