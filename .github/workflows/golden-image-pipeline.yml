name: Golden Image Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'generate_test_image.py'
      - 'scripts/**'
      - 'golden-images/**'
      - 'requirements-ci.txt'
      - '.github/workflows/golden-image-pipeline.yml'
  workflow_dispatch:
    inputs:
      variant:
        description: 'Variant number passed to generate_test_image.py (change this to simulate a different rendered image)'
        required: false
        default: '0'

env:
  MIN_SSIM: '0.98'
  CLOUDSMITH_REPO: koneu/image-test

jobs:
  compare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      exceeds_threshold: ${{ steps.compare.outputs.exceeds_threshold }}
      ssim_score: ${{ steps.compare.outputs.ssim_score }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Generate candidate image
        run: python3 generate_test_image.py --variant "${{ github.event.inputs.variant || '0' }}" --out candidate.png

      - name: Resolve current golden image
        id: golden
        run: |
          if [ -s golden-images/output.manifest.json ] && [ "$(jq -r '.current // empty' golden-images/output.manifest.json)" != "" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "version=$(jq -r '.current.version' golden-images/output.manifest.json)" >> "$GITHUB_OUTPUT"
            echo "package=$(jq -r '.package_name' golden-images/output.manifest.json)" >> "$GITHUB_OUTPUT"
            echo "filename=$(jq -r '.current.filename' golden-images/output.manifest.json)" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download golden image
        if: steps.golden.outputs.exists == 'true'
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          cloudsmith download "$CLOUDSMITH_REPO" "${{ steps.golden.outputs.package }}" \
            --version "${{ steps.golden.outputs.version }}" --outfile golden.png -y

      - name: Compare images
        id: compare
        run: |
          if [ "${{ steps.golden.outputs.exists }}" == "true" ]; then
            python3 scripts/compare_images.py --candidate candidate.png --golden golden.png --min-ssim "$MIN_SSIM"
          else
            python3 scripts/compare_images.py --candidate candidate.png --min-ssim "$MIN_SSIM"
          fi

      # GitHub strips data: URI images from job summaries, so golden/candidate/diff
      # need to be reachable over https to actually render. Candidate and diff only
      # exist for this run, so they're pushed as short-lived preview packages; golden
      # already lives in Cloudsmith. All three URLs embed the read-only entitlement
      # token so the image loads without auth (image-test is a private repo).
      - name: Publish preview images
        id: previews
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          RUN_TAG="run-${{ github.run_id }}-${{ github.run_attempt }}"
          TOKEN="${{ secrets.CLOUDSMITH_ENTITLEMENT_TOKEN }}"

          cloudsmith push raw "$CLOUDSMITH_REPO" candidate.png --name output-preview --version "$RUN_TAG" >/dev/null
          echo "candidate_url=https://dl.cloudsmith.io/$TOKEN/$CLOUDSMITH_REPO/raw/names/output-preview/versions/$RUN_TAG/candidate.png" >> "$GITHUB_OUTPUT"

          if [ -f diff.png ]; then
            cloudsmith push raw "$CLOUDSMITH_REPO" diff.png --name output-diff-preview --version "$RUN_TAG" >/dev/null
            echo "diff_url=https://dl.cloudsmith.io/$TOKEN/$CLOUDSMITH_REPO/raw/names/output-diff-preview/versions/$RUN_TAG/diff.png" >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ steps.golden.outputs.exists }}" == "true" ]; then
            echo "golden_url=https://dl.cloudsmith.io/$TOKEN/$CLOUDSMITH_REPO/raw/names/${{ steps.golden.outputs.package }}/versions/${{ steps.golden.outputs.version }}/${{ steps.golden.outputs.filename }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Render summary
        run: |
          python3 scripts/render_summary.py \
            --status "${{ steps.compare.outputs.status }}" \
            --candidate-url "${{ steps.previews.outputs.candidate_url }}" \
            --diff-url "${{ steps.previews.outputs.diff_url }}" \
            --golden-url "${{ steps.previews.outputs.golden_url }}" \
            --golden-size "${{ steps.compare.outputs.golden_size }}" \
            --candidate-size "${{ steps.compare.outputs.candidate_size }}" \
            --ssim-score "${{ steps.compare.outputs.ssim_score }}" \
            --min-ssim "$MIN_SSIM"

      - name: Upload candidate for promotion
        uses: actions/upload-artifact@v4
        with:
          name: candidate-image
          path: candidate.png
          retention-days: 14

      - name: Enforce threshold
        if: steps.golden.outputs.exists == 'true' && steps.compare.outputs.exceeds_threshold == 'true'
        run: |
          echo "SSIM score ${{ steps.compare.outputs.ssim_score }} is below minimum $MIN_SSIM"
          exit 1

  promote:
    needs: compare
    if: always() && needs.compare.outputs.exceeds_threshold == 'true'
    runs-on: ubuntu-latest
    environment: golden-image-approval
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install Cloudsmith CLI
        run: pip install cloudsmith-cli

      - name: Download candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: candidate-image

      - name: Compute next version
        id: version
        run: |
          if [ -s golden-images/output.manifest.json ]; then
            CURRENT=$(jq -r '.current.version // "v0"' golden-images/output.manifest.json | sed 's/^v//')
          else
            CURRENT=0
          fi
          NEXT=$((CURRENT + 1))
          echo "version=v$NEXT" >> "$GITHUB_OUTPUT"

      - name: Upload candidate as new golden
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          cp candidate.png output.png
          cloudsmith push raw "$CLOUDSMITH_REPO" output.png \
            --name output --version "${{ steps.version.outputs.version }}" \
            --summary "Golden image ${{ steps.version.outputs.version }}, promoted by ${{ github.actor }}"

      - name: Update manifest
        run: |
          SHA=$(sha256sum output.png | cut -d' ' -f1)
          jq -n \
            --arg owner "koneu" \
            --arg repo "image-test" \
            --arg version "${{ steps.version.outputs.version }}" \
            --arg sha256 "$SHA" \
            --arg promoted_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg promoted_by "${{ github.actor }}" \
            --arg run_id "${{ github.run_id }}" \
            '{cloudsmith_owner: $owner, cloudsmith_repo: $repo, package_name: "output", current: {version: $version, filename: "output.png", sha256: $sha256, promoted_at: $promoted_at, promoted_by: $promoted_by, workflow_run_id: $run_id}}' \
            > golden-images/output.manifest.json

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add golden-images/output.manifest.json
          git commit -m "Promote golden image to ${{ steps.version.outputs.version }}"
          git push
