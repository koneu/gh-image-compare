name: Cleanup preview images

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete stale preview packages
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: python3 scripts/cleanup_previews.py --owner koneu --repo image-test --retention-days 7
